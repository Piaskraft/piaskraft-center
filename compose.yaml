services:
  postgres:
    image: postgres:17-alpine
    container_name: piaskraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: piaskraft_center
      POSTGRES_USER: piaskraft
      POSTGRES_PASSWORD: piaskraft_dev_password
    ports:
      - "5432:5432"
    volumes:
      - piaskraft_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piaskraft -d piaskraft_center"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  piaskraft_postgres_data:
